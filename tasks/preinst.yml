---

- name: install dependencies
  apt:
    state: latest
    update_cache: yes
    install_recommends: no
    name: 
      - apt-transport-https
      - dirmngr
      - gpg
      - gpg-agent

- name: check if vscode already available (eg via snap)
  command: "apt-cache madison code | grep ^code"
  register: vscode
  changed_when: false
  failed_when: false

- block:
  - name: get vscode repo key from microsoft
    apt_key:
      url: https://packages.microsoft.com/keys/microsoft.asc
      state: present

  - name: add vscode repository
    apt_repository:
      repo: deb [arch=amd64] https://packages.microsoft.com/repos/vscode stable main
      filename: vscode
      state: present
      validate_certs: yes
      update_cache: yes
  when: vscode.rc == 1
